
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "insightia"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "insightia_api:8000"

  - job_name: "gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "gateway:8000"
