events {}

http {
    # Pool de instâncias. Política padrão: round-robin.
    # max_fails / fail_timeout = health check passivo: após 2 falhas seguidas,
    # a instância fica fora de rotação por 10s.
    upstream insightia {
        server app-01:8000 max_fails=2 fail_timeout=10s;
        server app-02:8000 max_fails=2 fail_timeout=10s;
        server app-03:8000 max_fails=2 fail_timeout=10s;
        # teste de escala: descomente a linha abaixo e rode
        #   docker compose exec nginx nginx -s reload
        # server app-04:8000 max_fails=2 fail_timeout=10s;
    }

    # Log mostra qual instância atendeu cada requisição (evidência do teste 6)
    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr served_by=$upstream_http_x_served_by '
                  'tempo=$request_time';

    server {
        listen 80;

        # O padrão do NGINX é 1MB e bloquearia o upload de CSV (a API aceita até 20MB)
        client_max_body_size 25m;

        access_log /var/log/nginx/access.log lb;

        location / {
            proxy_pass http://insightia;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # se uma instância falhar, tenta a próxima na mesma requisição
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 3s;

            # a chamada ao Gemini pode demorar
            proxy_read_timeout 120s;
        }
    }
}